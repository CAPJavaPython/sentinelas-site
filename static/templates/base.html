{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08152f">
  <meta name="description" content="Sentinelas: olhar atento, vitória certa. Equipe da gincana de Esmeralda, RS.">
  <title>Sentinelas | Gincana Esmeralda</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <header class="site-header">
    <nav class="navbar navbar-expand-lg container py-3" aria-label="Navegação principal">
      <a class="navbar-brand brand-lockup" href="#inicio" aria-label="Sentinelas, início">
        <span class="brand-mark" aria-hidden="true">
          <!-- Símbolo vetorial provisório. Substitua pelo brasão oficial se desejar. -->
          <div class="image icon" role="img" aria-label="">
          </div>
        </span>
        <span class="brand-wordmark">
          <strong>SENTINELAS</strong>
          <small>GINCANA · ESMERALDA/RS</small>
        </span>
      </a>
      <button class="navbar-toggler custom-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="mainNav">
        <div class="navbar-nav align-items-lg-center gap-lg-4 pt-3 pt-lg-0">
          <a class="nav-link" href="#identidade">A equipe</a>
          <a class="nav-link" href="#valores">Nossa essência</a>
          <a class="nav-link nav-instagram" href="{% url 'login' %}" rel="noopener noreferrer">Entrar <span aria-hidden="true">↗</span></a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    {% block content %}
    {% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
      <a class="footer-brand" href="#inicio">SENTINELAS<span>.</span></a>
      <p>Gincana de Esmeralda · RS</p>
      <a class="footer-link" href="https://www.instagram.com/sentinelas_esmeralda" target="_blank" rel="noopener noreferrer">Siga nossa jornada no Instagram ↗</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
